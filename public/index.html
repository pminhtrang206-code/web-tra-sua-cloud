<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cloud MilkTea Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h2 class="text-center text-danger fw-bold mb-4">🧋 Đặt Trà Sữa Cloud</h2>
        <div class="row" id="product-list"></div>
        <div class="card mt-4 shadow">
            <div class="card-body">
                <h4>Giỏ Hàng</h4>
                <ul id="cart-items" class="list-group mb-3"><li class="list-group-item text-muted">Trống</li></ul>
                <h5>Tổng: <span id="total-price" class="text-danger">0đ</span></h5>
                <input type="text" id="c-name" class="form-control mb-2" placeholder="Họ tên">
                <input type="text" id="c-phone" class="form-control mb-2" placeholder="Số điện thoại">
                <input type="text" id="c-address" class="form-control mb-3" placeholder="Địa chỉ giao hàng">
                <button class="btn btn-success w-100" onclick="checkout()">Đặt Hàng</button>
            </div>
        </div>
    </div>
    <script>
        let products = [], cart = [];
        async function fetchProducts() {
            const res = await fetch('/api/products');
            products = await res.json();
            let html = '';
            products.forEach((p, i) => {
                html += `<div class="col-md-4 mb-3"><div class="card p-3"><h5>${p.name}</h5><p>${p.price}đ</p><button class="btn btn-outline-danger btn-sm" onclick="addToCart(${i})">Thêm</button></div></div>`;
            });
            document.getElementById('product-list').innerHTML = html;
        }
        function addToCart(i) {
            cart.push({ ...products[i], quantity: 1 });
            updateCart();
        }
        function updateCart() {
            let html = '', total = 0;
            cart.forEach(item => {
                total += item.price;
                html += `<li class="list-group-item">${item.name} - ${item.price}đ</li>`;
            });
            document.getElementById('cart-items').innerHTML = html || '<li class="list-group-item text-muted">Trống</li>';
            document.getElementById('total-price').innerText = total + 'đ';
        }
        async function checkout() {
            const data = {
                customerName: document.getElementById('c-name').value,
                phone: document.getElementById('c-phone').value,
                address: document.getElementById('c-address').value,
                items: cart,
                totalAmount: cart.reduce((s, i) => s + i.price, 0)
            };
            const res = await fetch('/api/orders', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            if (res.ok) { alert("Đặt hàng thành công lên Cloud!"); cart = []; updateCart(); }
        }
        fetchProducts();
    </script>
</body>
</html>
